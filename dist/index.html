*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17213a;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{width:224px;background:#111d36;color:#c9d3e7;position:fixed;inset:0 auto 0 0;padding:28px 18px}.brand{font-size:20px;font-weight:800;color:white;letter-spacing:-.5px;padding:0 10px}.brand span{color:#69a5ff}.sub{font-size:12px;color:#8594af;margin:5px 10px 38px}.nav{padding:13px 14px;border-radius:9px;background:#263858;color:white;font-weight:700}.navsmall{color:#8998b3;font-size:12px;font-weight:700;margin:30px 13px 12px}.sideinfo{font-size:13px;line-height:1.8;padding:0 13px;color:#aab8d0}.main{margin-left:224px;padding:32px 42px 60px;max-width:1800px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:13px;font-weight:700;color:#5276b7;letter-spacing:.06em}h1{font-size:29px;letter-spacing:-1px;margin:8px 0}p{color:#738099;margin:0}.primary{background:#285ecb;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700}.banner{background:#edf4ff;color:#496693;border:1px solid #dce9fc;border-radius:9px;padding:12px 16px;margin:24px 0 20px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:white;border:1px solid #e5eaf2;border-radius:12px;box-shadow:0 4px 15px #1c315008}.stat{padding:20px}.stat label{color:#78859a;font-weight:600;font-size:13px}.stat strong{display:block;font-size:27px;margin-top:10px}.stat small{font-size:13px;color:#8793a7;font-weight:400}.panel{margin-top:20px;padding:22px}.panelhead{display:flex;justify-content:space-between;align-items:center}.panel h2{font-size:18px;margin:0}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}input,select,textarea{border:1px solid #dce3ed;border-radius:7px;padding:10px 12px;background:#fff;color:#283653}input:focus,textarea:focus,select:focus{outline:2px solid #b9d1ff;border-color:#6f9dec}.search{min-width:240px;flex:1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:920px;text-align:left}th{font-size:12px;color:#8a97aa;background:#f8fafd;padding:13px 12px;border-bottom:1px solid #e7edf4}td{padding:17px 12px;border-bottom:1px solid #edf1f6;vertical-align:middle;color:#526079;font-size:14px}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f8faff}.title{color:#182944;font-weight:700;font-size:15px}.muted{display:block;font-size:12px;color:#9aa6b8;margin-top:5px}.tag{display:inline-block;background:#eff4ff;color:#3563b2;border-radius:5px;padding:5px 8px;font-size:12px;font-weight:700;margin:2px}.tag.gray{background:#f1f3f7;color:#68778e}.empty{text-align:center;padding:60px;color:#8995a7}.modal{position:fixed;inset:0;background:#111d3699;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{background:white;width:min(850px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:28px}.dialoghead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;font-size:25px;color:#7b8798}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin-top:16px}.field label{font-weight:700;font-size:13px;color:#44536b}.full{grid-column:1/-1}textarea{resize:vertical;min-height:78px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{font-weight:500}.checks input{margin-right:5px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.secondary{border:1px solid #d8e1ed;background:white;color:#526079;border-radius:8px;padding:11px 16px}.danger{color:#c34646}.detail h3{font-size:13px;color:#8390a4;margin:20px 0 7px}.detail .value{white-space:pre-wrap;line-height:1.6}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 25px}@media(max-width:800px){aside{display:none}.main{margin:0;padding:22px 16px}.stats{grid-template-columns:1fr 1fr}.grid,.detailgrid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;gap:10px}h1{font-size:24px}}
</style><link rel="stylesheet" href="forms.css?v=65e73242bbc4"><link rel="stylesheet" href="governance.css?v=e0054b3fd334"><link rel="stylesheet" href="operations.css?v=1e0c9f267438"><link rel="stylesheet" href="approvals.css?v=c02066e91967"><link rel="stylesheet" href="report-requests.css?v=8f3d344228b0"></head><body><aside><div class="brand"><span>AT</span> PROJECT</div><div class="sub">과제 통합 관리</div><div class="nav">▦ &nbsp;전체 과제</div><div class="navsmall">WORKSPACE</div><div class="sideinfo">과제 현황과 담당 정보를<br>한 곳에서 관리합니다.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">AT PROJECT MANAGEMENT</div><h1>전체 과제 현황</h1><p>팀별 과제와 담당자, 기술 및 분류를 한눈에 확인하세요.</p></div><button class="primary" onclick="openForm()">＋ 새 과제 등록</button></div><div class="banner">시연 화면 · 과제는 이 브라우저에만 저장됩니다. 조직도 및 팀 간 공유 기능은 연동 전입니다. 예시 데이터는 실제 과제가 아닙니다.</div><div class="stats" id="stats"></div><section class="panel"><div class="panelhead"><div><h2>과제 목록</h2><p style="font-size:13px;margin-top:6px">과제를 선택하면 상세 내용을 확인하고 수정할 수 있습니다.</p></div><span id="count" style="color:#8491a5;font-size:13px"></span></div><div class="filters"><input class="search" id="search" placeholder="과제명, 담당자, 팀 검색" oninput="render()"><select id="techFilter" onchange="render()"><option value="">전체 Tech</option><option>DRAM</option><option>NAND</option><option>HBM</option><option>All Tech</option></select><select id="classFilter" onchange="render()"><option value="">전체 분류</option><option>팀 과제</option><option>담당 과제</option><option>mHTRS</option><option>HTRS</option><option>AI</option><option>DT</option></select><select id="statusFilter" onchange="render()"><option value="">전체 상태</option><option>계획</option><option>진행</option><option>완료</option><option>보류</option></select></div><div class="tablewrap"><table><thead><tr><th>과제명</th><th>소속 팀</th><th>담당자</th><th>대상 Tech</th><th>과제 분류</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>조건에 맞는 과제가 없습니다.</div></div></section></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div><script>
const key='at-project-demo-v1';const samples=[{id:'1',title:'차세대 공정 데이터 분석 체계 구축',team:'공정기술팀',po:'김서연',pm:'박지훈',members:'이수민, 최준호',tech:['DRAM: Lucy','DRAM: Spica'],type:'팀 과제',special:['AI'],status:'진행',background:'공정 데이터를 통합해 분석 효율을 높입니다.',kpi:'분석 소요 시간 단축',plan:'데이터 현황 파악 → 분석 모델 설계 → 시범 적용'}, {id:'2',title:'HBM 품질 지표 모니터링 개선',team:'품질혁신팀',po:'정하늘',pm:'윤민재',members:'한지우',tech:['HBM: HBM3E'],type:'담당 과제',special:['HTRS'],status:'계획',background:'주요 품질 지표의 가시성을 확보합니다.',kpi:'지표 확인 시간 단축',plan:'요구사항 정의 및 대시보드 설계'}, {id:'3',title:'NAND 업무 프로세스 표준화',team:'운영지원팀',po:'강예진',pm:'서도윤',members:'임지민',tech:['NAND ALL'],type:'팀 과제',special:['DT'],status:'진행',background:'반복 업무를 표준화합니다.',kpi:'업무 처리 시간 단축',plan:'현행 프로세스 점검 및 개선안 수립'}];let data;try{data=JSON.parse(localStorage.getItem(key))||samples}catch{data=samples}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(data))}function render(){let q=document.querySelector('#search').value.toLowerCase(),t=document.querySelector('#techFilter').value,c=document.querySelector('#classFilter').value,s=document.querySelector('#statusFilter').value;let list=data.filter(x=>!x.archivedAt&&([x.title,x.team,x.po,x.pm,x.members].join(' ').toLowerCase().includes(q))&&(!t||(t==='All Tech'?x.tech.includes('All Tech'):x.tech.includes('All Tech')||x.tech.some(a=>a.startsWith(t))))&&(!c||x.type===c||x.special.includes(c))&&(!s||x.status===s));document.querySelector('#stats').innerHTML=[['전체 과제',data.filter(x=>!x.archivedAt).length,'건'],['진행 중',data.filter(x=>!x.archivedAt&&x.status==='진행').length,'건'],['참여 팀',new Set(data.filter(x=>!x.archivedAt).map(x=>x.team).filter(Boolean)).size,'개'],['AI / DT 과제',data.filter(x=>!x.archivedAt&&(x.special.includes('AI')||x.special.includes('DT'))).length,'건']].map(a=>`<div class="stat"><label>${a[0]}</label><strong>${a[1]} <small>${a[2]}</small></strong></div>`).join('');document.querySelector('#count').textContent=`${list.length}개 과제`;document.querySelector('#rows').innerHTML=list.map(x=>`<tr data-id="${esc(x.id)}" onclick="detail('${esc(x.id)}')"><td><span class="title">${esc(x.title)}</span><span class="muted">${esc(x.background||'배경/목표 미입력')}</span></td><td>${esc(x.team||'미지정')}</td><td>PM ${esc(x.pm||'미지정')}<span class="muted">PO ${esc(x.po||'미지정')}</span></td><td>${x.tech.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</td><td>${[x.type,...x.special].filter(Boolean).map(a=>`<span class="tag gray">${esc(a)}</span>`).join('')}</td><td>${esc(x.status)}</td></tr>`).join('');document.querySelector('#empty').hidden=!!list.length}function closeModal(){document.querySelector('#modal').classList.remove('show')}function detail(id){let x=data.find(a=>a.id===id);let fields=[['소속 팀',x.team],['상태',x.status],['PO',x.po],['PM',x.pm],['공동 수행자',x.members],['대상 Tech',x.tech.join(', ')],['과제 분류',[x.type,...x.special].filter(Boolean).join(', ')],['mHTRS / HTRS 하위 분류',x.htrsSub],['AI / DT 하위 분류',x.aiSub],['배경 / 목표',x.background],['KPI',x.kpi],['추진 계획',x.plan]];document.querySelector('#dialog').innerHTML=`<div class="dialoghead"><div><div class="eyebrow">PROJECT DETAIL</div><h2>${esc(x.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detail detailgrid">${fields.map(([k,v])=>`<div><h3>${k}</h3><div class="value">${esc(v||'미입력')}</div></div>`).join('')}</div><div class="actions"><button class="secondary danger" onclick="removeItem('${esc(id)}')">삭제</button><button class="primary" onclick="openForm('${esc(id)}')">과제 수정</button></div>`;document.querySelector('#modal').classList.add('show')}function removeItem(id){if(confirm('이 과제를 삭제할까요?')){data=data.filter(x=>x.id!==id);save();render();closeModal()}}const techs=['DRAM: Legacy','DRAM: Lucy','DRAM: Spica','DRAM: Procyon','DRAM ALL','NAND: Legacy','NAND: Colosseum','NAND: Olympus','NAND ALL','HBM: Legacy','HBM: HBM3','HBM: HBM3E','HBM ALL','All Tech'];function openForm(id){let x=data.find(a=>a.id===id)||{tech:[],special:[],status:'계획'};let field=(name,label,placeholder='',required=false)=>`<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" value="${esc(x[name]||'')}" placeholder="${placeholder}" ${required?'required':''}></div>`;let area=(name,label)=>`<div class="field full"><label>${label}</label><textarea name="${name}" placeholder="내용을 입력하세요">${esc(x[name]||'')}</textarea></div>`;document.querySelector('#dialog').innerHTML=`<div class="dialoghead"><div><div class="eyebrow">PROJECT ${id?'EDIT':'CREATE'}</div><h2>${id?'과제 수정':'새 과제 등록'}</h2></div><button class="close" onclick="closeModal()">×</button></div><p style="font-size:13px">담당자는 조직도 연동 전까지 직접 입력합니다.</p><form id="form" onsubmit="submitForm(event,'${id||''}')"><div class="grid">${field('title','과제 제목','과제명을 입력하세요',true)}${field('team','소속 팀','팀명 입력',true)}${field('po','PO','이름 입력')}${field('pm','PM','이름 입력')}${field('members','공동 수행자','쉼표로 구분해 입력')}<div class="field"><label>상태</label><select name="status">${['계획','진행','완료','보류'].map(a=>`<option ${x.status===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field full"><label>대상 Tech · 복수 선택 가능</label><div class="checks">${techs.map(a=>`<label><input type="checkbox" name="tech" value="${a}" ${x.tech.includes(a)?'checked':''}>${a}</label>`).join('')}</div></div><div class="field"><label>과제 분류</label><select name="type"><option value="">선택</option>${['팀 과제','담당 과제'].map(a=>`<option ${x.type===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label>추가 분류 · 복수 선택 가능</label><div class="checks">${['mHTRS','HTRS','AI','DT'].map(a=>`<label><input type="checkbox" name="special" value="${a}" ${x.special.includes(a)?'checked':''}>${a}</label>`).join('')}</div></div>${field('htrsSub','mHTRS / HTRS 하위 분류','추후 결정')}${field('aiSub','AI / DT 하위 분류','추후 결정')}${area('background','배경 / 목표')}${area('kpi','KPI')}${area('plan','추진 계획')}</div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">취소</button><button class="primary" type="submit">과제 저장</button></div></form>`;document.querySelector('#modal').classList.add('show')}function submitForm(e,id){e.preventDefault();let f=new FormData(e.target);let x={id:id||String(Date.now()),...Object.fromEntries(f.entries()),tech:f.getAll('tech'),special:f.getAll('special')};if(!x.tech.length){alert('대상 Tech를 하나 이상 선택해주세요.');return}if(id)data=data.map(a=>a.id===id?x:a);else data.unshift(x);save();render();closeModal()}render();</script><script src="plan-model.js?v=32fbf6e105d3"></script><script src="portfolio-model.js?v=7cb1574cf2a5"></script><script src="monthly.js?v=5211b810342a"></script><script src="dashboard.js?v=3e17ab1f1144"></script><script src="performance.js?v=929f86410c9c"></script><script src="components.js?v=3c6404b33942"></script><script src="project-insights.js?v=7882ee069622"></script><script src="governance.js?v=82aa8ea6f8db"></script><script src="operations-model.js?v=76286f18d483"></script><script src="approval-model.js?v=036f14df83d8"></script><script src="report-requests-model.js?v=daef503cb9b4"></script><script src="operations.js?v=bb85146772e9"></script><script src="drafts.js?v=388532a700f5"></script><script src="approvals.js?v=de537373ad88"></script><script src="report-requests.js?v=3166b6c545af"></script><script src="demo-scenarios.js?v=88eab1a63be4"></script><script src="demo-examples.js?v=3549de04d931"></script><script src="personal-dashboard-model.js?v=963096a672a6"></script><script src="personal-home.js?v=08d416fb25e8"></script><script src="knowledge-model.js?v=0125435630df"></script><script src="knowledge-engine.js?v=ccaa30d997e1"></script><script src="knowledge.js?v=56cf2aa62db0"></script></body></html>
