name: FastAPI backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: at_fastapi_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d at_fastapi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/at_fastapi_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Domain, HTTP, authentication and real PostgreSQL tests
        run: python -m pytest -q
      - name: Build standalone backend image
        run: docker build -t at-project-hub-api:test .
