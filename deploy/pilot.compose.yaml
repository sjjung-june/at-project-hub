# Run from repo root: docker compose --env-file backend/.env -f deploy/pilot.compose.yaml up --build -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: at_project_hub
      POSTGRES_USER: at_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - pilot_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U at_app -d at_project_hub']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://at_app:${POSTGRES_PASSWORD}@postgres:5432/at_project_hub
    command: ['python', '-m', 'app.db']
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://at_app:${POSTGRES_PASSWORD}@postgres:5432/at_project_hub
    volumes:
      - pilot_files:/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
volumes:
  pilot_db:
  pilot_files:
