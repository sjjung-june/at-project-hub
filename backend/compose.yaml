services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: at_project_hub
      POSTGRES_USER: at_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - at_project_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U at_app -d at_project_hub']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://at_app:${POSTGRES_PASSWORD}@postgres:5432/at_project_hub
    command: ['python', '-m', 'app.db']
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://at_app:${POSTGRES_PASSWORD}@postgres:5432/at_project_hub
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - at_attachments:/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  at_project_data:
  at_attachments:
