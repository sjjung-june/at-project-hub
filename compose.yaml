services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: at_project_hub
      POSTGRES_USER: at_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - at_project_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U at_app -d at_project_hub']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  at_project_data:
